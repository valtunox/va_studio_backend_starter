version: "3.9"

services:
  app:
    image: ${DOCKER_IMAGE:-va_studio_backend}:${DOCKER_TAG:-latest}
    container_name: va_studio_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=false
      - ENVIRONMENT=production
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - va_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  db:
    image: postgres:16-alpine
    container_name: va_studio_db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-va_studio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - va_network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: va_studio_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - va_network
    restart: always

  celery_worker:
    image: ${DOCKER_IMAGE:-va_studio_backend}:${DOCKER_TAG:-latest}
    container_name: va_studio_celery_worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - va_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  celery_beat:
    image: ${DOCKER_IMAGE:-va_studio_backend}:${DOCKER_TAG:-latest}
    container_name: va_studio_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - va_network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: va_studio_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - va_network
    restart: always

networks:
  va_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
