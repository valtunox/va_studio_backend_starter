services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — host port 5439 (avoids clash with any local postgres on 5432)
  # Internal port 5432 is used by fastapi within the Docker network
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: studioapp-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5439}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vacloudopsdb2}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vacloudopsdb2}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - studioapp-network

  # ---------------------------------------------------------------------------
  # FastAPI — Python 3.11 + Uvicorn on port 5112
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studioapp-api
    image: ${DOCKER_IMAGE:-studioapp-api:latest}
    ports:
      - "${PORT:-5112}:5112"
    networks:
      - studioapp-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=5112
      - HOST=0.0.0.0

      # --- Database URL (used by settings.py + alembic) ---
      # Uses internal Docker hostname 'postgres' on port 5432 (not the host-mapped 5433)
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vacloudopsdb2}

      # --- POSTGRES_* vars (read by app/core/db.py) ---
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-vacloudopsdb2}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}

      # --- DATABASE_* vars (legacy compat in docker-compose env block) ---
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${POSTGRES_DB:-vacloudopsdb2}
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}

      # --- AI / Cloud Keys ---
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - APOLLO_API_KEY=${APOLLO_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-}

      # --- App config ---
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3008","http://localhost:3000"]}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5112/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./app/data:/app/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

networks:
  studioapp-network:
    driver: bridge

volumes:
  postgres-data:
